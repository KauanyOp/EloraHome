<section class="pagina-produtos">

  <div class="titulo-pagina">
    <h1>Nossos produtos</h1>
    <p>Encontre os detalhes que deixam sua casa ainda mais especial.</p>
  </div>

  <div class="filtros">
    <button>Todos</button>
    <button>Cama</button>
    <button>Organização</button>
    <button>Decoração</button>
    <button>Cozinha</button>
  </div>

  <div class="lista-produtos">

    @for (produto of produtos; track produto.id) {
      <div class="card-produto">

        <a [routerLink]="['/produto', produto.id]">
          <img
            src="https://placehold.co/300x300"
            [alt]="produto.nome"
          >
        </a>

        <div class="informacoes-produto">
          <h3>{{ produto.nome }}</h3>
          <p>R$ {{ produto.preco }},00</p>

          <a [routerLink]="['/produto', produto.id]">
            Ver produto
          </a>
        </div>

      </div>
    }

  </div>

</section>
