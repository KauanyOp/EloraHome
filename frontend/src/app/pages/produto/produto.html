<div>

  <img
    src="https://placehold.co/500x350"
    alt="produto"
  >

  <div>

    <h1>{{ produto.nome }}</h1>

    <h2>R$ {{ produto.preco }}</h2>

    <p>{{ produto.descricao }}</p>

    <label for="quantidade-produto">Quantidade</label>

    <input
      id="quantidade-produto"
      type="number"
      min="1"
      [value]="quantidade()"
      (input)="atualizarQuantidade($event)"
    >

    <button type="button" (click)="adicionarAoCarrinho()">
      Adicionar ao carrinho
    </button>

  </div>

</div>
